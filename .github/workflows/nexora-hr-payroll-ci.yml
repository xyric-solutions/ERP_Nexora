name: Nexora HR Payroll CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: nexora_test
          POSTGRES_USER: nexora
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.4-alpine
        ports: ["56380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
        env:
          MINIO_ROOT_USER: nexora-test
          MINIO_ROOT_PASSWORD: nexora-test-secret
        ports: ["59000:9000"]
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Create isolated source-migration database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U nexora nexora_source_test
      - run: npm ci
      - name: Initialize private test bucket
        run: >-
          docker run --rm --network host --entrypoint /bin/sh
          ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
          -ec 'mc alias set local http://127.0.0.1:59000 nexora-test nexora-test-secret &&
          mc mb --ignore-existing local/nexora-test && mc anonymous set none local/nexora-test'
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run api:check
      - run: npm run db:migrate:test
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run test:security
      - run: npm run test:integration
      - run: npm run test:performance
      - run: npm run test:legacy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan Nexora workspace for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a
          detect --no-git --source=/repo --redact --exit-code=1

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f docker/Dockerfile --target ${{ matrix.app }} -t nexora-${{ matrix.app }}:ci .
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: nexora-${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
