name: nexora-test
services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: nexora_test
      POSTGRES_USER: nexora
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./docker/postgres/002-create-test-databases.sql:/docker-entrypoint-initdb.d/002-create-test-databases.sql:ro
  redis:
    image: redis:8.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: nexora-test
      MINIO_ROOT_PASSWORD: nexora-test-secret
    ports:
      - "127.0.0.1:59000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data
  minio-init:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    depends_on:
      minio: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 nexora-test nexora-test-secret
        mc mb --ignore-existing local/nexora-test
        mc anonymous set none local/nexora-test
